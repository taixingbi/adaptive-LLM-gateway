# Experiment D — priority inversion.
# 80 batch tenants send high traffic; 20 critical tenants stay light.
# Compare critical-tenant SLO attainment across policies.

name: priority_inversion
scenario: S4
backend: us.amazon.nova-micro-v1:0
tenants: 100
duration_s: 300
policies: [none, rpm, tpm, token-bucket, priority, slo-aware]
mix:
  batch:
    tenants: 80
    tier: P3
    traffic: high
  critical:
    tenants: 20
    tier: P1
    traffic: low
plot:
  metric: critical_slo_attainment
repetitions: 5
smoke:
  tenants: 10
  duration_s: 120
