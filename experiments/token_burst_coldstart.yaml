# Experiment 1 — cold-start climb of Ĉ from C0.
# Same 500 RPM / 100-tenant token-burst shape, but Ĉ is reset to 100k
# before every repetition so the trace reads 100k → 115k → 130k → …

name: token_burst_coldstart
scenario: S3
backend: us.amazon.nova-micro-v1:0
tenants: 100
rpm: 500
policies: [adaptive-slo]
platform_tpm_budget: 100000
phases:
  - name: normal
    start_s: 0
    end_s: 120
    prompt_class: short
    input_tokens: 500
    max_tokens: 64
  - name: burst
    start_s: 120
    end_s: 300
    prompt_class: long
    input_tokens: 5000
    max_tokens: 256
  - name: recovery
    start_s: 300
    end_s: 480
    prompt_class: short
    input_tokens: 500
    max_tokens: 64
repetitions: 5
smoke:
  tenants: 10
  duration_s: 120
