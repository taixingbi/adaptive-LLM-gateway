# Experiment A — load sweep. Same tenants, prompts, model, AWS setup.
# Only admission_policy changes across runs.
#
# Offered load is a fraction of PLATFORM_TPM_BUDGET (synthetic C), not AWS quota.

name: load_sweep
scenario: S1
backend: us.amazon.nova-micro-v1:0
tenants: 100
prompt_class: medium
policies: [none, rpm, tpm, token-bucket, priority, slo-aware]
load_pct: [50, 80, 100, 120, 150]
duration_s: 300
repetitions: 3
smoke:
  tenants: 10
  rpm: 20
  duration_s: 300
