# Experiment 3 — high Ĉ, then contract, then recover.
# 0–360s: no background; healthy AIMD should climb 100k → ≥1M (×1.15 / 15s).
# 360–600s: laptop Bedrock client bypasses admission (same account / Nova Micro).
# 600–900s: background off; Ĉ recovers.

name: provider_contraction
scenario: S3
backend: us.amazon.nova-micro-v1:0
tenants: 100
rpm: 500
duration_s: 900
policies: [adaptive-slo]
platform_tpm_budget: 100000
phases:
  - name: normal
    start_s: 0
    end_s: 900
    prompt_class: short
    input_tokens: 500
    max_tokens: 64
background:
  start_s: 360
  end_s: 600
  concurrency: 8
  model: us.amazon.nova-micro-v1:0
  prompt_class: long
  max_tokens: 256
repetitions: 5
smoke:
  tenants: 10
  duration_s: 180
