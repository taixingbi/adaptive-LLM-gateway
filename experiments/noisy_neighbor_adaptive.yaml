# Adaptive validation — noisy neighbor.
# Compare adaptive-slo vs existing static slo-aware baselines.

name: noisy_neighbor
scenario: S2
backend: us.amazon.nova-micro-v1:0
platform_tpm_budget: 100000
tenants: 100
victim: tenant-007
prompt_class: medium
policies: [adaptive-slo]
phases:
  - minutes: [0, 3]
    burst: 1x
  - minutes: [3, 6]
    burst: 10x
  - minutes: [6, 9]
    burst: 1x
repetitions: 5
plot:
  exclude_victim: true
  metrics: [p99_ttft, slo_attainment, throttle_rate, effective_slo_goodput]
smoke:
  tenants: 10
  duration_s: 180
