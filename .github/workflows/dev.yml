name: dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "terraform/**"
      - ".github/workflows/dev.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4

      - name: Read account_id
        id: tfvars
        working-directory: terraform/envs/dev
        run: |
          ACCOUNT_ID=$(grep -E '^account_id' terraform.tfvars | awk -F'"' '{print $2}')
          REGION=$(grep -E '^region' terraform.tfvars | awk -F'"' '{print $2}')
          if [ "$ACCOUNT_ID" = "000000000000" ]; then
            echo "::error::Set account_id in terraform/envs/dev/terraform.tfvars to the real 12-digit AWS account, then apply module.platform.module.iam once from a laptop."
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "role_arn=arn:aws:iam::${ACCOUNT_ID}:role/github-actions-bedrock-platform" >> "$GITHUB_OUTPUT"
          echo "Assuming $ACCOUNT_ID role github-actions-bedrock-platform"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.tfvars.outputs.role_arn }}
          aws-region: ${{ steps.tfvars.outputs.region }}
          audience: sts.amazonaws.com

      # Preserve live experiment knobs. Laptop `run_experiment.py --deploy` sets
      # admission_policy/run_id via -var; a naive apply from tfvars (defaults to
      # none/dev) was clobbering mid-run adaptive-slo experiments.
      - name: Terraform apply
        working-directory: terraform/envs/dev
        env:
          REGION: ${{ steps.tfvars.outputs.region }}
        run: |
          terraform init -input=false
          TD=$(aws ecs describe-services --cluster bedrock-platform-dev-llm --services llm-gateway --region "$REGION" --query 'services[0].taskDefinition' --output text 2>/dev/null || true)
          POLICY=$(grep -E '^admission_policy' terraform.tfvars | awk -F'"' '{print $2}')
          RUN_ID=$(grep -E '^run_id' terraform.tfvars | awk -F'"' '{print $2}')
          ALPHA=0.15
          BETA=0.7
          WINDOW=15
          if [ -n "$TD" ] && [ "$TD" != "None" ]; then
            LIVE_POLICY=$(aws ecs describe-task-definition --task-definition "$TD" --region "$REGION" --query 'taskDefinition.containerDefinitions[0].environment[?name==`ADMISSION_POLICY`].value' --output text)
            LIVE_RUN=$(aws ecs describe-task-definition --task-definition "$TD" --region "$REGION" --query 'taskDefinition.containerDefinitions[0].environment[?name==`RUN_ID`].value' --output text)
            LIVE_ALPHA=$(aws ecs describe-task-definition --task-definition "$TD" --region "$REGION" --query 'taskDefinition.containerDefinitions[0].environment[?name==`ADAPTIVE_ALPHA`].value' --output text)
            LIVE_BETA=$(aws ecs describe-task-definition --task-definition "$TD" --region "$REGION" --query 'taskDefinition.containerDefinitions[0].environment[?name==`ADAPTIVE_BETA`].value' --output text)
            LIVE_WINDOW=$(aws ecs describe-task-definition --task-definition "$TD" --region "$REGION" --query 'taskDefinition.containerDefinitions[0].environment[?name==`ADAPTIVE_WINDOW_S`].value' --output text)
            [ -n "$LIVE_POLICY" ] && [ "$LIVE_POLICY" != "None" ] && POLICY="$LIVE_POLICY"
            [ -n "$LIVE_RUN" ] && [ "$LIVE_RUN" != "None" ] && RUN_ID="$LIVE_RUN"
            [ -n "$LIVE_ALPHA" ] && [ "$LIVE_ALPHA" != "None" ] && ALPHA="$LIVE_ALPHA"
            [ -n "$LIVE_BETA" ] && [ "$LIVE_BETA" != "None" ] && BETA="$LIVE_BETA"
            [ -n "$LIVE_WINDOW" ] && [ "$LIVE_WINDOW" != "None" ] && WINDOW="$LIVE_WINDOW"
          fi
          echo "Preserving admission_policy=$POLICY run_id=$RUN_ID alpha=$ALPHA beta=$BETA window=$WINDOW"
          terraform apply -input=false -auto-approve \
            -var="admission_policy=${POLICY}" \
            -var="run_id=${RUN_ID}" \
            -var="adaptive_alpha=${ALPHA}" \
            -var="adaptive_beta=${BETA}" \
            -var="adaptive_window_s=${WINDOW}"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push gateway
        env:
          REGION: ${{ steps.tfvars.outputs.region }}
        run: |
          ECR=$(terraform -chdir=terraform/envs/dev output -raw ecr_repository_url)
          docker build --platform linux/amd64 -t "$ECR:latest" gateway
          docker push "$ECR:latest"
          aws ecs update-service --cluster bedrock-platform-dev-llm --service llm-gateway --force-new-deployment --region "$REGION" || true
